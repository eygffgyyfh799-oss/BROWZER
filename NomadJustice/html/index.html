<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>State Records System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="hidden">
        <div class="tablet">
            <aside class="sidebar">
                <div class="brand">
                    <div class="brand-icon">⚖️</div>
                    <div>
                        <div class="brand-title">State Records</div>
                        <div class="brand-sub">Justice · Police · Counsel</div>
                    </div>
                </div>
                <div class="me" id="me"></div>
                <nav id="nav"></nav>
                <div class="sidebar-foot">Press <kbd>ESC</kbd> to close</div>
            </aside>

            <main class="main">
                <header class="topbar">
                    <button class="icon-btn" id="btn-back" title="Back">←</button>
                    <h1 id="page-title">Dashboard</h1>
                    <div class="topbar-actions">
                        <div class="loader" id="loader"></div>
                        <button class="icon-btn" id="btn-refresh" title="Refresh">⟳</button>
                        <button class="icon-btn danger" id="btn-close" title="Close">✕</button>
                    </div>
                </header>
                <section id="content" class="content"></section>
            </main>
        </div>
    </div>

    <div id="modal-root"></div>
    <div id="toasts"></div>

    <script src="vendor/d3.min.js"></script>
    <script src="charts.js"></script>
    <script src="app.js"></script>
</body>
</html>
