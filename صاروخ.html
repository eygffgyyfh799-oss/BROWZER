<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المدينة المحروقة</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #05060d;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* أزرار التحكم */
        .controls {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .controls button {
            background: rgba(20, 20, 20, 0.85);
            color: #eee;
            border: 2px solid #caa27c;
            border-radius: 8px;
            padding: 10px 22px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .controls button:hover:not(:disabled) { background: #caa27c; color: #fff; }
        .controls button:disabled { opacity: 0.4; cursor: default; }
    </style>
</head>
<body>
    <div class="controls">
        <button id="launch">🚀 إطلاق الصاروخ</button>
        <button id="reset">↺ إعادة</button>
    </div>
    <canvas id="scene"></canvas>

    <script>
        // مشهد بصري فقط: مدينة بدون أي أشخاص، صاروخ يسقط ثم تتحول المدينة لمدينة محروقة
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');
        const launchBtn = document.getElementById('launch');
        const resetBtn = document.getElementById('reset');

        let W, H, ground;
        let buildings = [];
        let particles = [];
        let missile = null;
        let state = 'idle';      // idle | falling | burning
        let burn = 0;            // نسبة الاحتراق من 0 إلى 1
        let flash = 0;           // وميض الانفجار
        let shake = 0;           // اهتزاز الشاشة
        let shockwave = null;
        let impactX = 0;
        const stars = [];

        function rand(a, b) { return a + Math.random() * (b - a); }
        function lerp(a, b, t) { return a + (b - a) * t; }
        function mix(c1, c2, t) {
            return `rgb(${Math.round(lerp(c1[0], c2[0], t))},${Math.round(lerp(c1[1], c2[1], t))},${Math.round(lerp(c1[2], c2[2], t))})`;
        }

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            ground = H * 0.85;
            buildCity();
        }

        // بناء المدينة
        function buildCity() {
            buildings = [];
            stars.length = 0;
            for (let i = 0; i < 120; i++) stars.push({ x: rand(0, W), y: rand(0, H * 0.6), r: rand(0.5, 1.5) });

            // طبقتان: خلفية وأمامية
            for (const layer of [0, 1]) {
                let x = -20;
                while (x < W + 20) {
                    const w = rand(40, 95);
                    const h = layer === 0 ? rand(H * 0.25, H * 0.55) : rand(H * 0.12, H * 0.4);
                    const windows = [];
                    for (let wy = 14; wy < h - 14; wy += 18) {
                        for (let wx = 8; wx < w - 12; wx += 14) {
                            windows.push({ x: wx, y: wy, lit: Math.random() < 0.55, fire: Math.random() < 0.35, phase: rand(0, 6.28) });
                        }
                    }
                    // شكل السقف المكسور بعد الاحتراق
                    const broken = [];
                    const steps = 5 + Math.floor(Math.random() * 4);
                    for (let s = 0; s <= steps; s++) broken.push(rand(0, h * 0.3));
                    buildings.push({
                        x, w, h, layer, windows, broken,
                        antenna: Math.random() < 0.3,
                        smoke: Math.random() < 0.5,
                    });
                    x += w + rand(2, 12);
                }
            }
        }

        // إطلاق الصاروخ
        function launch() {
            if (state !== 'idle') return;
            impactX = rand(W * 0.35, W * 0.65);
            missile = { x: impactX - W * 0.35, y: -60, vx: W * 0.35 / 90, vy: (ground - H * 0.2 + 60) / 90 };
            state = 'falling';
            launchBtn.disabled = true;
        }

        function reset() {
            state = 'idle';
            burn = 0; flash = 0; shake = 0;
            missile = null; shockwave = null;
            particles = [];
            launchBtn.disabled = false;
            buildCity();
        }

        // الانفجار
        function explode(x, y) {
            flash = 1;
            shake = 25;
            shockwave = { x, y, r: 0 };
            for (let i = 0; i < 260; i++) {
                const a = rand(Math.PI, Math.PI * 2);
                const s = rand(2, 14);
                particles.push({ type: 'fire', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, decay: rand(0.008, 0.02), size: rand(8, 30) });
            }
            for (let i = 0; i < 80; i++) {
                const a = rand(Math.PI * 1.05, Math.PI * 1.95);
                const s = rand(4, 16);
                particles.push({ type: 'debris', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, decay: rand(0.005, 0.012), size: rand(2, 6) });
            }
            state = 'burning';
        }

        function spawnAmbient() {
            if (state !== 'burning') return;
            // دخان يتصاعد من المباني
            for (const b of buildings) {
                if (!b.smoke || Math.random() > 0.08 * burn) continue;
                const top = ground - b.h + b.broken[0];
                particles.push({ type: 'smoke', x: b.x + rand(0, b.w), y: top, vx: rand(-0.3, 0.6), vy: rand(-1.4, -0.6), life: 1, decay: rand(0.003, 0.006), size: rand(15, 30) });
            }
            // جمر متطاير
            for (let i = 0; i < 3 * burn; i++) {
                particles.push({ type: 'ember', x: rand(0, W), y: ground - rand(0, H * 0.3), vx: rand(-0.5, 1), vy: rand(-2, -0.5), life: 1, decay: rand(0.005, 0.015), size: rand(1, 3) });
            }
            // ألسنة لهب صغيرة فوق المباني
            for (const b of buildings) {
                if (Math.random() > 0.05 * burn) continue;
                particles.push({ type: 'fire', x: b.x + rand(0, b.w), y: ground - b.h + b.broken[0] + 5, vx: rand(-0.3, 0.3), vy: rand(-2, -0.8), life: 1, decay: rand(0.02, 0.04), size: rand(6, 14) });
            }
        }

        function update() {
            if (state === 'falling' && missile) {
                missile.x += missile.vx;
                missile.y += missile.vy;
                missile.vy *= 1.01;
                // ذيل الصاروخ
                particles.push({ type: 'trail', x: missile.x, y: missile.y, vx: rand(-0.5, 0.5), vy: rand(-0.5, 0.5), life: 1, decay: 0.02, size: rand(5, 10) });
                if (missile.y >= ground - H * 0.15) {
                    explode(missile.x, missile.y);
                    missile = null;
                }
            }

            if (state === 'burning' && burn < 1) burn = Math.min(1, burn + 0.004);
            flash *= 0.92;
            shake *= 0.9;
            if (shockwave) {
                shockwave.r += 22;
                if (shockwave.r > Math.max(W, H) * 1.5) shockwave = null;
            }

            spawnAmbient();

            for (const p of particles) {
                p.x += p.vx;
                p.y += p.vy;
                if (p.type === 'debris') p.vy += 0.3;
                if (p.type === 'fire') { p.vx *= 0.95; p.vy = p.vy * 0.95 - 0.08; }
                if (p.type === 'smoke') p.size += 0.35;
                p.life -= p.decay;
            }
            particles = particles.filter(p => p.life > 0 && p.y < H + 50);
        }

        function drawSky() {
            const g = ctx.createLinearGradient(0, 0, 0, ground);
            g.addColorStop(0, mix([8, 10, 30], [40, 10, 5], burn));
            g.addColorStop(1, mix([30, 35, 80], [190, 70, 20], burn));
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, H);

            ctx.fillStyle = `rgba(255,255,255,${0.8 * (1 - burn)})`;
            for (const s of stars) { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill(); }
        }

        function drawBuilding(b, t) {
            const top = ground - b.h;
            const base = b.layer === 0 ? [35, 40, 70] : [22, 25, 45];
            const charred = b.layer === 0 ? [30, 22, 18] : [14, 11, 10];
            ctx.fillStyle = mix(base, charred, burn);

            // المبنى (مع سقف مكسور تدريجياً)
            ctx.beginPath();
            ctx.moveTo(b.x, ground);
            const n = b.broken.length - 1;
            for (let i = 0; i <= n; i++) {
                ctx.lineTo(b.x + (b.w * i) / n, top + b.broken[i] * burn);
            }
            ctx.lineTo(b.x + b.w, ground);
            ctx.closePath();
            ctx.fill();

            if (b.antenna && burn < 0.5) {
                ctx.strokeStyle = ctx.fillStyle;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(b.x + b.w / 2, top);
                ctx.lineTo(b.x + b.w / 2, top - 25 * (1 - burn * 2));
                ctx.stroke();
            }

            // النوافذ: مضاءة قبل، ثم نار أو سواد بعد الاحتراق
            ctx.save();
            ctx.clip();
            for (const w of b.windows) {
                let color;
                if (burn < 0.05) {
                    color = w.lit ? 'rgba(255,220,130,0.85)' : 'rgba(10,12,25,0.8)';
                } else if (w.fire) {
                    const f = 0.6 + 0.4 * Math.sin(t / 120 + w.phase);
                    color = `rgba(255,${Math.round(90 + 60 * f)},20,${f * burn})`;
                } else {
                    color = `rgba(5,4,4,${0.6 + 0.4 * burn})`;
                }
                ctx.fillStyle = color;
                ctx.fillRect(b.x + w.x, top + w.y, 7, 10);
            }
            ctx.restore();

            // آثار سواد (حروق) على الواجهة
            if (burn > 0) {
                const g = ctx.createLinearGradient(0, top, 0, ground);
                g.addColorStop(0, `rgba(0,0,0,${0.5 * burn})`);
                g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = g;
                ctx.fillRect(b.x, top, b.w, b.h);
            }
        }

        function drawParticles() {
            for (const p of particles) {
                const a = Math.max(0, p.life);
                if (p.type === 'smoke') {
                    ctx.fillStyle = `rgba(30,25,25,${a * 0.5})`;
                } else if (p.type === 'fire' || p.type === 'trail') {
                    const g = Math.round(lerp(40, 220, a));
                    ctx.fillStyle = `rgba(255,${g},${Math.round(a * 60)},${a})`;
                } else if (p.type === 'ember') {
                    ctx.fillStyle = `rgba(255,150,40,${a})`;
                } else {
                    ctx.fillStyle = `rgba(40,30,25,${a})`;
                }
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.type === 'fire' ? p.size * a : p.size, 0, 6.28);
                ctx.fill();
            }
        }

        function drawMissile() {
            if (!missile) return;
            const angle = Math.atan2(missile.vy, missile.vx);
            ctx.save();
            ctx.translate(missile.x, missile.y);
            ctx.rotate(angle);
            ctx.fillStyle = '#bbb';
            ctx.fillRect(-30, -5, 40, 10);
            ctx.fillStyle = '#c33';
            ctx.beginPath();
            ctx.moveTo(10, -5); ctx.lineTo(24, 0); ctx.lineTo(10, 5);
            ctx.fill();
            ctx.fillStyle = '#777';
            ctx.beginPath();
            ctx.moveTo(-30, -5); ctx.lineTo(-38, -12); ctx.lineTo(-22, -5);
            ctx.moveTo(-30, 5); ctx.lineTo(-38, 12); ctx.lineTo(-22, 5);
            ctx.fill();
            ctx.restore();
        }

        function render(t) {
            update();

            ctx.save();
            if (shake > 0.5) ctx.translate(rand(-shake, shake), rand(-shake, shake));

            drawSky();

            // توهج النار في الأفق
            if (burn > 0) {
                const g = ctx.createRadialGradient(impactX, ground, 0, impactX, ground, W * 0.7);
                g.addColorStop(0, `rgba(255,110,20,${0.45 * burn})`);
                g.addColorStop(1, 'rgba(255,60,0,0)');
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, W, H);
            }

            for (const b of buildings) if (b.layer === 0) drawBuilding(b, t);
            for (const b of buildings) if (b.layer === 1) drawBuilding(b, t);

            // الأرض
            ctx.fillStyle = mix([15, 15, 22], [20, 12, 8], burn);
            ctx.fillRect(-50, ground, W + 100, H - ground + 50);

            // حفرة الانفجار
            if (state === 'burning') {
                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                ctx.beginPath();
                ctx.ellipse(impactX, ground + 4, 70 * Math.min(1, burn * 4), 12, 0, 0, 6.28);
                ctx.fill();
            }

            drawParticles();
            drawMissile();

            if (shockwave) {
                ctx.strokeStyle = `rgba(255,220,180,${Math.max(0, 1 - shockwave.r / (W * 0.8)) * 0.6})`;
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(shockwave.x, shockwave.y, shockwave.r, 0, 6.28);
                ctx.stroke();
            }

            ctx.restore();

            if (flash > 0.01) {
                ctx.fillStyle = `rgba(255,240,210,${flash})`;
                ctx.fillRect(0, 0, W, H);
            }

            requestAnimationFrame(render);
        }

        launchBtn.addEventListener('click', launch);
        resetBtn.addEventListener('click', reset);
        window.addEventListener('resize', resize);

        resize();
        requestAnimationFrame(render);
    </script>
</body>
</html>
